<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07100d">
<title>MacroForge — Login</title>
<link rel="stylesheet" href="styles.css">
<style>
.auth-page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  background:
    radial-gradient(circle at 20% 20%,rgba(217,255,100,.06),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(80,180,130,.05),transparent 30%),
    #07100d;
}
.auth-shell{
  width:min(100%,460px);
}
.auth-brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}
.auth-brand-mark{
  width:42px;
  height:42px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:#d9ff64;
  color:#07100d;
  font-weight:950;
  font-size:20px;
}
.auth-brand b{
  display:block;
  letter-spacing:2px;
}
.auth-brand strong{
  display:block;
  color:#d9ff64;
  letter-spacing:2px;
}
.auth-card{
  border:1px solid #1c332a;
  border-radius:24px;
  padding:30px;
  background:#0b1713;
  box-shadow:0 30px 90px rgba(0,0,0,.35);
}
.auth-card h1{
  margin:0 0 8px;
  font-size:32px;
}
.auth-card > p{
  margin:0 0 22px;
  color:#789187;
  line-height:1.55;
}
.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  padding:5px;
  border-radius:12px;
  background:#07100d;
  margin-bottom:20px;
}
.auth-tab{
  border:0;
  border-radius:9px;
  background:transparent;
  color:#789187;
  padding:10px;
  cursor:pointer;
}
.auth-tab.active{
  background:#10221b;
  color:#d9ff64;
}
.auth-form{
  display:grid;
  gap:13px;
}
.auth-form label{
  display:grid;
  gap:7px;
  color:#8ca49a;
  font-size:12px;
}
.auth-form input{
  width:100%;
  box-sizing:border-box;
  border:1px solid #29463a;
  background:#07100d;
  color:#eef8f3;
  border-radius:10px;
  padding:12px;
  outline:0;
}
.auth-form input:focus{
  border-color:#d9ff64;
}
.auth-submit{
  margin-top:4px;
}
.auth-link{
  border:0;
  background:none;
  color:#b6c9c0;
  cursor:pointer;
  padding:3px;
  text-align:center;
}
.auth-link:hover{
  color:#d9ff64;
}
.auth-message{
  display:none;
  border-radius:10px;
  padding:11px 12px;
  margin-bottom:12px;
  font-size:12px;
  line-height:1.45;
}
.auth-message.show{
  display:block;
}
.auth-message.error{
  background:#241214;
  border:1px solid #593033;
  color:#ffb8b8;
}
.auth-message.success{
  background:#10221b;
  border:1px solid #365548;
  color:#cce6d9;
}
.auth-note{
  margin-top:18px;
  font-size:10px;
  line-height:1.5;
  color:#61786e;
}
@media(max-width:500px){
  .auth-page{padding:14px}
  .auth-card{padding:22px}
  .auth-card h1{font-size:27px}
}
</style>
</head>
<body>
<main class="auth-page">
  <section class="auth-shell">
    <div class="auth-brand">
      <div class="auth-brand-mark">M</div>
      <div>
        <b>MACRO</b>
        <strong>FORGE</strong>
      </div>
    </div>

    <div class="auth-card">
      <span class="pill">MEMBERS AREA</span>
      <h1 id="authTitle">Welcome back.</h1>
      <p id="authSubtitle">
        Sign in to continue tracking your nutrition and training.
      </p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab">Log in</button>
        <button class="auth-tab" id="signupTab">Create account</button>
      </div>

      <div class="auth-message" id="authMessage"></div>

      <form class="auth-form" id="authForm">
        <label>
          Username
          <input
            id="authUsername"
            type="text"
            autocomplete="username"
            placeholder="Choose a username"
            minlength="3"
            maxlength="30"
            required
          >
        </label>

        <label>
          Password
          <input
            id="authPassword"
            type="password"
            autocomplete="current-password"
            minlength="6"
            placeholder="At least 6 characters"
            required
          >
        </label>

        <label id="confirmWrap" style="display:none">
          Confirm password
          <input
            id="authConfirm"
            type="password"
            autocomplete="new-password"
            minlength="6"
            placeholder="Repeat your password"
          >
        </label>

        <button class="primary full auth-submit" type="submit" id="authSubmit">
          Log in
        </button>
      </form>

      <p class="auth-note">
        No email verification for now. Your account is stored locally in this browser.
        Use a real password, and export your MacroForge data before changing devices.
      </p>
    </div>
  </section>
</main>

<script>
(function(){
  "use strict";
  const title=document.getElementById("authTitle");
  const subtitle=document.getElementById("authSubtitle");
  const message=document.getElementById("authMessage");
  const form=document.getElementById("authForm");
  const username=document.getElementById("authUsername");
  const password=document.getElementById("authPassword");
  const confirm=document.getElementById("authConfirm");
  const confirmWrap=document.getElementById("confirmWrap");
  const submit=document.getElementById("authSubmit");
  const loginTab=document.getElementById("loginTab");
  const signupTab=document.getElementById("signupTab");
  const ACCOUNT_KEYS=["macroforge_accounts_v2","macroforge_accounts_v1"];
  const SESSION_KEY="macroforge_session_v1";
  let mode="login";
  function showMessage(text,type="error"){message.textContent=text;message.className="auth-message show "+type;}
  function clearMessage(){message.textContent="";message.className="auth-message";}
  function readAccounts(){
    const merged=[];const seen=new Set();
    for(const key of ACCOUNT_KEYS){try{const arr=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(arr))for(const a of arr){const n=String(a.usernameLower||a.username||"").toLowerCase();if(n&&!seen.has(n)){seen.add(n);merged.push(a)}}}catch(e){}}
    return merged;
  }
  function saveAccounts(arr){localStorage.setItem(ACCOUNT_KEYS[0],JSON.stringify(arr));}
  async function hash(value){
    try{if(globalThis.crypto&&crypto.subtle){const bytes=new TextEncoder().encode(value);const d=await crypto.subtle.digest("SHA-256",bytes);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}}catch(e){}
    let h=2166136261;for(let i=0;i<value.length;i++)h=Math.imul(h^value.charCodeAt(i),16777619);return "fallback_"+(h>>>0).toString(16);
  }
  function setSession(a){localStorage.setItem(SESSION_KEY,JSON.stringify({id:a.id||("mf_"+Date.now()),username:a.username,createdAt:a.createdAt||new Date().toISOString()}));}
  function setMode(next){
    mode=next;clearMessage();const signup=mode==="signup";
    loginTab.classList.toggle("active",!signup);signupTab.classList.toggle("active",signup);
    title.textContent=signup?"Create your account.":"Welcome back.";
    subtitle.textContent=signup?"Create a MacroForge account with no email verification.":"Log in to continue tracking your nutrition and training.";
    confirmWrap.style.display=signup?"grid":"none";confirm.required=signup;submit.textContent=signup?"Create account":"Sign in";
  }
  loginTab.addEventListener("click",()=>setMode("login"));signupTab.addEventListener("click",()=>setMode("signup"));
  form.addEventListener("submit",async function(e){
    e.preventDefault();e.stopPropagation();clearMessage();
    const u=username.value.trim(),pw=password.value,n=u.toLowerCase();
    if(!/^[A-Za-z0-9_.-]{3,30}$/.test(u)){showMessage("Username must be 3–30 characters and use letters, numbers, . _ or -.");return;}
    if(pw.length<6){showMessage("Password must be at least 6 characters.");return;}
    if(mode==="signup"&&pw!==confirm.value){showMessage("Passwords do not match.");return;}
    submit.disabled=true;submit.textContent=mode==="signup"?"Creating…":"Signing in…";
    try{
      const accounts=readAccounts();const existing=accounts.find(a=>String(a.usernameLower||a.username||"").toLowerCase()===n);
      if(mode==="signup"){
        if(existing){showMessage("That username already exists. Use Log in instead.");return;}
        const account={id:(globalThis.crypto?.randomUUID?crypto.randomUUID():"mf_"+Date.now()),username:u,usernameLower:n,passwordHash:await hash(pw),createdAt:new Date().toISOString()};
        accounts.push(account);saveAccounts(accounts);setSession(account);window.location.replace("index.html");return;
      }
      if(!existing){showMessage("Account not found. Create an account first.");return;}
      const stored=existing.passwordHash||existing.password||"";
      const valid=stored===await hash(pw)||stored===pw;
      if(!valid){showMessage("Incorrect password.");return;}
      setSession(existing);window.location.replace("index.html");
    }catch(err){console.error(err);showMessage("Sign in could not be completed in this browser. Please try again.");}
    finally{submit.disabled=false;submit.textContent=mode==="signup"?"Create account":"Sign in";}
  });
  setMode("login");
})();
</script>
</body>
</html>
